  # ─────────────── 需要人工判断的公共层 ───────────────
  - id: shared-ui
    match:
      - "packages/ui-components/web/**"
      - "packages/web-runtime/web/**"
      - "apps/web/src/components/**"
      - "apps/web/src/lib/**"
    mode: manual
