# main 变更 → 测试用例影响面映射
#
# 用法：
#   python -X utf8 sync/validate_map.py                     # 校验所有目标路径存在
#   python -X utf8 sync/validate_map.py --impact BASE HEAD --repo <FenixAgent 仓库>
#
# 规则自上而下全部匹配（不短路），命中的 target 取并集。
# targets 可以是目录（以 / 结尾，表示候选集合，由 AI 在集合内挑选文件）
# 或具体文件。mode=manual 表示只进入人工关注清单，不触发 AI。

version: 1

ignore:
  - "docs/**"
  - "*.md"
  - ".github/**"
  - "bun.lock"
  - "drizzle/**"
  - "deploy/**"
  - "docker/**"
  - "data/**"
  - "workspaces/**"
  - "**/node_modules/**"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.css"
  - "**/i18n/**"

rules:
  # ─────────────── 单测 ───────────────
  - id: unit-acp-link
    match: ["packages/acp-link/**"]
    targets: { unit: ["unit_tests/packages/acp-link/"] }
  - id: unit-chat-channel
    match: ["packages/chat-channel/**"]
    targets: { unit: ["unit_tests/packages/chat-channel/"] }
  - id: unit-core
    match: ["packages/core/**"]
    targets: { unit: ["unit_tests/packages/core/"] }
  - id: unit-opensandbox-cluster
    match: ["packages/opensandbox-cluster/**"]
    targets: { unit: ["unit_tests/packages/opensandbox-cluster/"] }
  - id: unit-orchestration
    match: ["packages/orchestration/**"]
    targets: { unit: ["unit_tests/packages/orchestration/"] }
  - id: unit-plugin-ccb
    match: ["packages/plugin-ccb/**"]
    targets: { unit: ["unit_tests/packages/plugin-ccb/"] }
  - id: unit-plugin-claude-code
    match: ["packages/plugin-claude-code/**"]
    targets: { unit: ["unit_tests/packages/plugin-claude-code/"] }
  - id: unit-plugin-opencode
    match: ["packages/plugin-opencode/**"]
    targets: { unit: ["unit_tests/packages/plugin-opencode/"] }
  - id: unit-plugin-sdk
    match: ["packages/plugin-sdk/**"]
    targets: { unit: ["unit_tests/packages/plugin-sdk/"] }
  - id: unit-sandbox-provider
    match: ["packages/sandbox-provider/**"]
    targets: { unit: ["unit_tests/packages/sandbox-provider/"] }
  - id: unit-workflow-engine
    match: ["packages/workflow-engine/**"]
    targets: { unit: ["unit_tests/packages/workflow-engine/"] }

  - id: unit-auth
    match:
      - "packages/platform/identity/src/**"
    targets:
      unit:
        - "unit_tests/auth/"
        - "unit_tests/plugins/system-api-auth.test.ts"

  - id: unit-errors
    match:
      - "packages/*/src/errors/**"
      - "packages/platform/*/src/errors/**"
      - "apps/server/src/errors/**"
    targets:
      unit:
        - "unit_tests/errors/"

  - id: unit-logger
    match:
      - "packages/logger/**"
      - "apps/server/src/telemetry/**"
    targets:
      unit:
        - "unit_tests/packages/logger/"
        - "unit_tests/logs/"
        - "unit_tests/plugins/logger.test.ts"

  - id: unit-transport
    match:
      - "packages/acp-server/**"
      - "packages/remote-runtime/**"
      - "packages/agent-runtime/src/transport/**"
      - "packages/chat-channel/src/transport/**"
      - "packages/chat-channel/src/relay/**"
    targets:
      unit:
        - "unit_tests/transport/"

  - id: unit-services
    match:
      - "packages/*/src/services/**"
      - "packages/*/src/domain/**"
      - "packages/platform/*/src/services/**"
      - "packages/resources/*/src/**"
      - "apps/server/src/services/**"
    targets:
      unit:
        - "unit_tests/services/"

  - id: unit-utils
    match:
      - "packages/*/src/utils/**"
      - "packages/platform/*/src/utils/**"
      - "apps/server/src/utils/**"
    targets:
      unit:
        - "unit_tests/utils/"

  # ─────────────── API 用例 ───────────────
  - id: api-agent-runtime
    match:
      - "packages/agent-runtime/src/routes/acp/**"
    targets:
      api:
        - "tests/api_suites/test_acp_api.py"

  - id: api-instance
