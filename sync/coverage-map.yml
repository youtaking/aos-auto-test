  # ─────────────── E2E 用例 ───────────────
  - id: e2e-agent-config
    match:
      - "packages/resources/agent-config/web/pages/**"
      - "apps/web/src/routes/agent/$agentId.tsx"
      - "apps/web/src/routes/agent/_panel.tsx"
    targets:
      e2e:
        - "tests/suites/test_agent_manage.py"
        - "tests/suites/test_agent_config_v2.py"
        - "tests/suites/test_sites.py"

  - id: e2e-algorithms
    match:
      - "apps/web/src/routes/agent/_panel/algorithms.tsx"
    targets:
