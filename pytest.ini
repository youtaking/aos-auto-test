[pytest]
testpaths = tests/suites tests/api_suites
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    p0: critical path tests
    p1: important feature tests
    p2: nice-to-have tests
    smoke: smoke test suite
    no_browser: skip Playwright browser initialization for API tests
    no_page_error_check: skip page-error monitor assertion (test intentionally triggers 4xx/5xx)
    order: pytest-order plugin marker
