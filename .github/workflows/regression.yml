name: RegressionEye Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      suite:
        description: '测试套件（留空=全部）'
        type: string
        required: false

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fenixagent
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 运行回归测试
        run: |
          pytest tests/suites/ \
            -v --tb=short \
            --json-report --json-report-file=report.json \
            ${{ github.event.inputs.suite && format('-k {0}', github.event.inputs.suite) || '' }}
        env:
          FENIXAGENT_URL: ${{ secrets.FENIXAGENT_URL }}

      - name: 上报结果到看板
        if: always()
        run: |
          python -c "
          import json, httpx, os
          url = os.environ.get('REGRESSION_EYE_URL', '')
          token = os.environ.get('RE_TOKEN', '')
          if url and token and os.path.exists('report.json'):
              report = json.load(open('report.json'))
              httpx.post(f'{url}/api/runs/report',
                  headers={'Authorization': f'Bearer {token}'},
                  json=report, timeout=30)
          "
        env:
          REGRESSION_EYE_URL: ${{ secrets.REGRESSION_EYE_URL }}
          RE_TOKEN: ${{ secrets.RE_TOKEN }}

      - name: 上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 7
