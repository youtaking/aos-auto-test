services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auto_test
      POSTGRES_USER: re
      POSTGRES_PASSWORD: re
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://re:re@db:5432/auto_test
      SCREENSHOTS_DIR: /screenshots
    volumes:
      - screenshots:/screenshots
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - screenshots:/screenshots
    profiles:
      - runner
    depends_on:
      - backend

volumes:
  pgdata:
  screenshots:
