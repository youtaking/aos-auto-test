services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U re -d auto_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: auto_test
      POSTGRES_USER: re
      POSTGRES_PASSWORD: re
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8111:8111"
    environment:
      DATABASE_URL: postgresql+asyncpg://re:re@db:5432/auto_test
      SCREENSHOTS_DIR: /screenshots
    volumes:
      - screenshots:/screenshots
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      BACKEND_URL: http://backend:8111
    volumes:
      - screenshots:/screenshots
    profiles:
      - runner
    depends_on:
      - backend

volumes:
  pgdata:
  screenshots:
